<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Asteria Online Pixel MMO v24</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{touch-action:none;font-family:Arial,sans-serif;color:#ffe4a8}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none}.panel{background:#211914eF;border:3px solid #8b663b;border-radius:9px;box-shadow:0 3px #0b0908,inset 0 0 0 1px #d0a66b55}
#top{position:absolute;top:9px;left:9px;width:280px;padding:8px}.name{font-weight:bold}.lv{float:right;color:#ffd86d}.bar{height:10px;background:#100c0b;border:2px solid #39271b;border-radius:4px;margin-top:4px;overflow:hidden}.fill{height:100%}.hp{background:#d82e35}.mp{background:#2d79df}.xp{background:#e0a92d}
#quest{position:absolute;right:9px;top:9px;width:230px;padding:8px;font-size:12px}.gold{color:#ffd86d}
#mini{position:absolute;right:12px;top:95px;width:105px;height:105px;border:3px solid #8b663b;border-radius:8px;background:#203b2c}
#chat{position:absolute;left:9px;bottom:10px;width:330px;padding:7px;font-size:11px;line-height:1.4}
#hot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.slot{width:52px;height:52px;border:3px solid #86613a;border-radius:8px;background:#34271e;color:#ffe1a0;font-size:23px}
#actions{position:absolute;right:10px;bottom:12px;display:flex;gap:7px;pointer-events:auto}.act{width:60px;height:60px;border-radius:50%;border:4px solid #9a7141;background:#30221a;color:#ffe3aa;font-weight:bold}.atk{width:76px;height:76px;background:#6b3024}
#joy{position:absolute;left:12px;bottom:12px;width:125px;height:125px;border-radius:50%;border:3px solid #86613a;background:#211a1599;pointer-events:auto}#stick{position:absolute;left:36px;top:36px;width:50px;height:50px;border-radius:50%;background:#705437;border:3px solid #bd9257}
#menu{position:absolute;left:9px;top:125px;display:flex;gap:5px;pointer-events:auto}.btn{padding:6px 8px;border:2px solid #86613a;background:#2b211a;color:#ffe1a0;border-radius:6px}
#inv{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,90vw);padding:12px;pointer-events:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.item{aspect-ratio:1;border:2px solid #705234;background:#17120f;border-radius:6px;display:grid;place-items:center;font-size:25px}
@media(max-width:700px){#top{width:230px}#quest{width:170px;font-size:10px}#chat{width:245px}.slot{width:45px;height:45px;font-size:19px}#actions{transform:scale(.82);transform-origin:right bottom}#joy{transform:scale(.82);transform-origin:left bottom}}
</style></head><body>
<canvas id="c"></canvas><div id="ui">
<div id="top" class="panel"><span class="name">Asteria Knight</span><span class="lv">Lv.<b id="lv">8</b></span><div class="bar"><div id="hp" class="fill hp"></div></div><div class="bar"><div id="mp" class="fill mp"></div></div><div class="bar" style="height:6px"><div id="xp" class="fill xp"></div></div></div>
<div id="quest" class="panel"><b>Forest Trouble</b><br>กำจัด Forest Slime <span id="qc">0/8</span><br><span class="gold">รางวัล 120 EXP • 80 Gold</span></div>
<canvas id="mini"></canvas>
<div id="menu"><button class="btn" id="ib">กระเป๋า</button><button class="btn" id="sb">บันทึก</button><button class="btn" id="db">เวลา</button></div>
<div id="chat" class="panel"><span class="gold">[System]</span> Asteria Village พร้อมแล้ว<br>แตะ ATTACK เพื่อโจมตีมอนสเตอร์</div>
<div id="hot"><button class="slot" onclick="use(0)">✚</button><button class="slot" onclick="use(1)">⚔</button><button class="slot" onclick="skill()">✦</button><button class="slot" onclick="dash()">➤</button></div>
<div id="actions"><button class="act" onclick="skill()">SKILL</button><button class="act atk" onclick="attack()">ATTACK</button></div>
<div id="joy"><div id="stick"></div></div>
<div id="inv" class="panel"><button class="btn" style="float:right" id="close">ปิด</button><h3>INVENTORY</h3><div class="grid" id="items"></div></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),mini=document.getElementById('mini'),m=mini.getContext('2d');
let W,H,day=1,keys={},joyX=0,joyY=0,target=null,kills=0,parts=[],texts=[],slashes=[],last=0;
function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;mini.width=105;mini.height=105}addEventListener('resize',size);size();
const world={w:2400,h:1700},p={x:1200,y:920,hp:100,mp:100,lv:8,xp:48,speed:180,atk:22,cd:0,scd:0};
const ms=[];
for(let i=0;i<11;i++)spawn();
function rnd(a,b){return a+Math.random()*(b-a)}function spawn(){ms.push({x:rnd(350,2100),y:rnd(390,1450),hp:55,max:55,spd:rnd(42,70)})}
function cam(){return{x:Math.max(0,Math.min(world.w-W,p.x-W/2)),y:Math.max(260,Math.min(world.h-H,p.y-H/2))}}
function tree(gx,gy,k){let q=cam(),X=gx-q.x,Y=gy-q.y;x.fillStyle='#0004';x.fillRect(X-17,Y+18,34,7);x.fillStyle='#6b4327';x.fillRect(X-6,Y-4,12,29);x.fillStyle=k?'#245e38':'#2d713d';x.fillRect(X-27,Y-34,54,43);x.fillStyle='#4b9650';x.fillRect(X-16,Y-48,32,27)}
function building(b){let q=cam(),X=b.x-q.x,Y=b.y-q.y;x.fillStyle='#0004';x.fillRect(X+8,Y+b.h,b.w,10);x.fillStyle=b.c;x.fillRect(X,Y,b.w,b.h);x.fillStyle=b.r;x.beginPath();x.moveTo(X-16,Y+40);x.lineTo(X+b.w/2,Y-45);x.lineTo(X+b.w+16,Y+40);x.fill();x.fillStyle='#75b6c2';x.fillRect(X+28,Y+62,45,38);x.fillRect(X+b.w-73,Y+62,45,38);x.fillStyle='#d6ad5e';x.fillRect(X+b.w*.43,Y+b.h*.55,b.w*.15,b.h*.45)}
function worldDraw(){let q=cam();x.fillStyle=day?'#72a95d':'#304b53';x.fillRect(0,0,W,H);x.fillStyle=day?'#4a9aae':'#28566a';x.fillRect(-q.x,-q.y,world.w,285);x.fillStyle=day?'#bd9659':'#776b50';x.fillRect(-q.x,790-q.y,world.w,170);x.fillStyle=day?'#b9c88b':'#69785e';x.fillRect(720-q.x,285-q.y,205,world.h);for(let i=0;i<42;i++)tree(130+(i*173)%2150,340+(i*137)%1240,i%3===0);[{x:850,y:600,w:300,h:210,c:'#875335',r:'#593027'},{x:1390,y:550,w:290,h:220,c:'#805036',r:'#512a25'},{x:1030,y:1080,w:270,h:210,c:'#88563a',r:'#5b3027'}].forEach(building);x.fillStyle='#8a5b35';for(let i=0;i<9;i++)x.fillRect(850+i*42-q.x,800-q.y,34,140)}
function char(o,enemy=false){let q=cam(),X=o.x-q.x,Y=o.y-q.y;x.fillStyle='#0005';x.fillRect(X-18,Y+13,36,7);if(enemy){x.fillStyle='#91cf48';x.fillRect(X-15,Y-16,30,28);x.fillStyle='#659934';x.fillRect(X-11,Y+10,22,8);x.fillStyle='#182018';x.fillRect(X-8,Y-7,5,5);x.fillRect(X+3,Y-7,5,5)}else{x.fillStyle='#d79a68';x.fillRect(X-10,Y-28,20,20);x.fillStyle='#573527';x.fillRect(X-13,Y-32,26,8);x.fillStyle='#2b527a';x.fillRect(X-15,Y-8,30,25);x.fillStyle='#182f4b';x.fillRect(X-13,Y+17,10,14);x.fillRect(X+3,Y+17,10,14);x.fillStyle='#c6d0d7';x.fillRect(X-20,Y-5,28,4)}}
function burst(o,n=10,col='#ffe071'){for(let i=0;i<n;i++)parts.push({x:o.x,y:o.y,vx:rnd(-100,100),vy:rnd(-110,20),t:.55,c:col})}
function text(o,s,col='#ffe071'){texts.push({x:o.x,y:o.y-35,s,t:1,c:col})}
function hit(a,d){a.hp-=d;burst(a,9);text(a,'-'+d);if(a.hp<=0){kills++;document.getElementById('qc').textContent=Math.min(8,kills)+'/8';p.xp+=7;text(a,'+35 EXP','#86dcff');spawn();ms.splice(ms.indexOf(a),1);if(p.xp>=100){p.xp-=100;p.lv++;p.hp=100;p.mp=100;text(p,'LEVEL UP!','#ffe071')}}}
function attack(mult=1){if(p.cd>0)return;p.cd=.4;let best=null,bd=125;for(const a of ms){let d=Math.hypot(a.x-p.x,a.y-p.y);if(d<bd){bd=d;best=a}}if(!best){text(p,'ไม่มีเป้าหมาย','#aaa');return}target=best;hit(best,Math.round(p.atk*mult));slashes.push({x:p.x,y:p.y,a:Math.atan2(best.y-p.y,best.x-p.x),t:.22})}
function skill(){if(p.scd>0||p.mp<20)return;p.mp-=20;p.scd=2.5;burst(p,30,'#72c8ff');text(p,'ASTRAL SLASH','#83d8ff');for(const a of [...ms])if(Math.hypot(a.x-p.x,a.y-p.y)<180)hit(a,38)}
function use(i){if(i===0)p.hp=Math.min(100,p.hp+35);else attack(1.4)}function dash(){p.x+=keys.a?-90:90;burst(p,12,'#b8f0ff')}
function update(dt){let dx=(keys.d?1:0)-(keys.a?1:0)+joyX,dy=(keys.s?1:0)-(keys.w?1:0)+joyY,l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;p.x+=dx*p.speed*dt;p.y+=dy*p.speed*dt}p.x=Math.max(70,Math.min(world.w-70,p.x));p.y=Math.max(340,Math.min(world.h-70,p.y));p.cd=Math.max(0,p.cd-dt);p.scd=Math.max(0,p.scd-dt);for(const a of ms){let d=Math.hypot(p.x-a.x,p.y-a.y);if(d<240&&d>38){a.x+=(p.x-a.x)/d*a.spd*dt;a.y+=(p.y-a.y)/d*a.spd*dt}if(d<38)p.hp-=8*dt}if(p.hp<=0){p.hp=100;p.mp=60;p.x=1200;p.y=920}for(const z of parts){z.x+=z.vx*dt;z.y+=z.vy*dt;z.vy+=150*dt;z.t-=dt}parts=parts.filter(z=>z.t>0);for(const z of texts){z.y-=25*dt;z.t-=dt}texts=texts.filter(z=>z.t>0);for(const z of slashes)z.t-=dt;slashes=slashes.filter(z=>z.t>0);document.getElementById('hp').style.width=p.hp+'%';document.getElementById('mp').style.width=p.mp+'%';document.getElementById('xp').style.width=p.xp+'%';document.getElementById('lv').textContent=p.lv}
function draw(){x.clearRect(0,0,W,H);worldDraw();ms.forEach(a=>{char(a,1);let q=cam(),X=a.x-q.x,Y=a.y-q.y;x.fillStyle='#170d0d';x.fillRect(X-21,Y-34,42,5);x.fillStyle='#e34a42';x.fillRect(X-20,Y-33,40*a.hp/a.max,3)});char(p);for(const z of slashes){let q=cam();x.save();x.translate(z.x-q.x,z.y-q.y);x.rotate(z.a);x.strokeStyle='#d9f2ff';x.lineWidth=6;x.globalAlpha=z.t/.22;x.beginPath();x.arc(0,0,48,-.7,.7);x.stroke();x.restore()}for(const z of parts){let q=cam();x.fillStyle=z.c;x.fillRect(z.x-q.x,z.y-q.y,4,4)}for(const z of texts){let q=cam();x.font='bold 13px monospace';x.textAlign='center';x.fillStyle='#000';x.fillText(z.s,z.x-q.x+2,z.y-q.y+2);x.fillStyle=z.c;x.fillText(z.s,z.x-q.x,z.y-q.y)}m.clearRect(0,0,105,105);m.fillStyle=day?'#356346':'#203b42';m.fillRect(0,0,105,105);m.fillStyle='#4c99a9';m.fillRect(0,0,105,17);m.fillStyle='#ad8954';m.fillRect(0,50,105,10);for(const a of ms){m.fillStyle='#9bd34d';m.fillRect(a.x/world.w*105-2,a.y/world.h*105-2,4,4)}m.fillStyle='#ffe071';m.fillRect(p.x/world.w*105-3,p.y/world.h*105-3,6,6)}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')attack();if(e.key==='3')skill()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.getElementById('ib').onclick=()=>document.getElementById('inv').style.display='block';document.getElementById('close').onclick=()=>document.getElementById('inv').style.display='none';
document.getElementById('sb').onclick=()=>{localStorage.asteria24=JSON.stringify(p);text(p,'GAME SAVED','#a8ffb0')};document.getElementById('db').onclick=()=>day=!day;
document.getElementById('items').innerHTML=['⚔','🛡','✚','◆','◇','✦','◈','●','★','☘'].map((a,i)=>'<div class="item">'+a+'</div>').join('');
const j=document.getElementById('joy'),st=document.getElementById('stick');function jm(e){let r=j.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),q=42;if(d>q){dx=dx/d*q;dy=dy/d*q}joyX=dx/q;joyY=dy/q;st.style.transform='translate('+dx+'px,'+dy+'px)'}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);jm(e)};j.onpointermove=e=>jm(e);j.onpointerup=()=>{joyX=joyY=0;st.style.transform='translate(0,0)'};
</script></body></html>
